name: New language proposal
description: Propose adding a UI translation for a new language
labels: [i18n]
body:
  - type: input
    id: language
    attributes:
      label: Language and BCP-47 code
      placeholder: French (fr), Portuguese — Brazil (pt-BR), …
    validations:
      required: true
  - type: input
    id: native
    attributes:
      label: Native name
      description: How the language names itself in the language picker.
      placeholder: Français
    validations:
      required: true
  - type: dropdown
    id: translator
    attributes:
      label: Can you translate it yourself?
      description: >-
        The UI has ~500 strings (see src/shared/locales/en.js). Native or
        fluent speakers preferred — machine-translated dictionaries are not
        accepted.
      options:
        - Yes, I'm a native/fluent speaker and will translate
        - Partially — I can review someone else's translation
        - No — this is a request only
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything special about this language? (optional)
      description: >-
        Right-to-left script, plural rules, formality conventions, regional
        variants worth distinguishing, etc.
