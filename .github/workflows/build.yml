name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach installers to (empty = build only)'
        required: false
        default: ''
  push:
    tags: ['v*']

# Third-party actions are pinned to commit SHAs (not floating tags) so a
# compromised action release can't run arbitrary code in jobs that hold
# signing credentials. Update the pins deliberately, verifying the SHA.

permissions:
  contents: read

jobs:
  # Windows and Linux builds are unsigned — no credentials in these jobs.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # attach installers to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npx electron-builder ${{ matrix.args }} --publish never

      # Best-effort: artifact storage is quota-limited on private repos, and a
      # full quota must not block attaching installers to the release below.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: openchat-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

      # On version tags (v1.0.0, v1.1.0, ...) — or a manual dispatch naming a
      # release tag — attach the installers to a GitHub Release so users can
      # download them from the Releases page.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag || '' }}
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap

  # macOS signing runs in its own job bound to the release-signing
  # environment: the Developer ID secrets live there (not repo-wide), and the
  # environment only admits runs from main or v* tags.
  build-mac:
    runs-on: macos-latest
    environment: release-signing
    permissions:
      contents: write # attach installers to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build (signed + notarized)
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: openchat-macos
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.release_tag || '' }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
            dist/*.blockmap
