name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64 --x64
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build (macOS, signed + notarized)
        if: runner.os == 'macOS'
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: openchat-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe

      # On version tags (v1.0.0, v1.1.0, ...), attach the installers to a
      # GitHub Release so users can download them from the Releases page.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
