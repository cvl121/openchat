# TEMPORARY — copies the signing secrets from repo level into the
# release-signing environment (secret values are write-only via the API, so
# only a workflow run can read them to move them). Deleted right after use.
name: Migrate secrets (temporary)

on: workflow_dispatch

permissions: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy signing secrets to the release-signing environment
        env:
          GH_TOKEN: ${{ secrets.ADMIN_MIGRATION_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            printf '%s' "${!name}" | gh secret set "$name" --env release-signing --repo "$GITHUB_REPOSITORY"
            echo "migrated $name"
          done
